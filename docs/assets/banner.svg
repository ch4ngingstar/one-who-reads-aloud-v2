<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">One Who Reads Aloud</title>
  <desc id="d">A waveform of one conversation: every cluster of bars is one speaker's turn, coloured by character.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#121219"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121219" stop-opacity="1"/>
      <stop offset="0.08" stop-color="#121219" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#121219" stop-opacity="0"/>
      <stop offset="1" stop-color="#121219" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Title -->
  <text x="640" y="118" text-anchor="middle" fill="#f2f0ff"
        font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="3">One Who Reads Aloud</text>
  <text x="640" y="158" text-anchor="middle" fill="#9a97b0"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" letter-spacing="4">A FULL-CAST AUDIOBOOK STUDIO THAT RUNS ON ONE GPU</text>

  <!-- The waveform: one scene. Narrator (slate) between character turns. -->
  <g transform="translate(0,262)">
    <!-- Narrator -->
    <g fill="#5d6175">
      <rect x="86" y="-14" width="6" height="28" rx="3"/><rect x="98" y="-22" width="6" height="44" rx="3"/>
      <rect x="110" y="-10" width="6" height="20" rx="3"/><rect x="122" y="-26" width="6" height="52" rx="3"/>
      <rect x="134" y="-18" width="6" height="36" rx="3"/><rect x="146" y="-8" width="6" height="16" rx="3"/>
      <rect x="158" y="-20" width="6" height="40" rx="3"/><rect x="170" y="-12" width="6" height="24" rx="3"/>
    </g>
    <!-- Sunny -->
    <g fill="#8b7bff">
      <rect x="194" y="-30" width="6" height="60" rx="3"/><rect x="206" y="-46" width="6" height="92" rx="3"/>
      <rect x="218" y="-24" width="6" height="48" rx="3"/><rect x="230" y="-38" width="6" height="76" rx="3"/>
      <rect x="242" y="-52" width="6" height="104" rx="3"/><rect x="254" y="-28" width="6" height="56" rx="3"/>
      <rect x="266" y="-16" width="6" height="32" rx="3"/>
    </g>
    <!-- Narrator -->
    <g fill="#5d6175">
      <rect x="290" y="-12" width="6" height="24" rx="3"/><rect x="302" y="-20" width="6" height="40" rx="3"/>
      <rect x="314" y="-9" width="6" height="18" rx="3"/><rect x="326" y="-16" width="6" height="32" rx="3"/>
    </g>
    <!-- Nephis -->
    <g fill="#f2c46d">
      <rect x="350" y="-26" width="6" height="52" rx="3"/><rect x="362" y="-42" width="6" height="84" rx="3"/>
      <rect x="374" y="-60" width="6" height="120" rx="3"/><rect x="386" y="-36" width="6" height="72" rx="3"/>
      <rect x="398" y="-22" width="6" height="44" rx="3"/><rect x="410" y="-44" width="6" height="88" rx="3"/>
      <rect x="422" y="-18" width="6" height="36" rx="3"/>
    </g>
    <!-- Cassie (telepathy: softer) -->
    <g fill="#5fd0c3">
      <rect x="446" y="-16" width="6" height="32" rx="3"/><rect x="458" y="-28" width="6" height="56" rx="3"/>
      <rect x="470" y="-20" width="6" height="40" rx="3"/><rect x="482" y="-34" width="6" height="68" rx="3"/>
      <rect x="494" y="-14" width="6" height="28" rx="3"/>
    </g>
    <!-- Narrator -->
    <g fill="#5d6175">
      <rect x="518" y="-18" width="6" height="36" rx="3"/><rect x="530" y="-10" width="6" height="20" rx="3"/>
      <rect x="542" y="-24" width="6" height="48" rx="3"/><rect x="554" y="-14" width="6" height="28" rx="3"/>
      <rect x="566" y="-20" width="6" height="40" rx="3"/><rect x="578" y="-8" width="6" height="16" rx="3"/>
    </g>
    <!-- Effie (laughing: tall, dense) -->
    <g fill="#ff8a65">
      <rect x="602" y="-40" width="6" height="80" rx="3"/><rect x="614" y="-64" width="6" height="128" rx="3"/>
      <rect x="626" y="-48" width="6" height="96" rx="3"/><rect x="638" y="-70" width="6" height="140" rx="3"/>
      <rect x="650" y="-44" width="6" height="88" rx="3"/><rect x="662" y="-58" width="6" height="116" rx="3"/>
      <rect x="674" y="-30" width="6" height="60" rx="3"/><rect x="686" y="-20" width="6" height="40" rx="3"/>
    </g>
    <!-- Sunny -->
    <g fill="#8b7bff">
      <rect x="710" y="-22" width="6" height="44" rx="3"/><rect x="722" y="-36" width="6" height="72" rx="3"/>
      <rect x="734" y="-18" width="6" height="36" rx="3"/><rect x="746" y="-30" width="6" height="60" rx="3"/>
    </g>
    <!-- Unnamed soldier (stand-in voice) -->
    <g fill="#a3b18a">
      <rect x="770" y="-34" width="6" height="68" rx="3"/><rect x="782" y="-50" width="6" height="100" rx="3"/>
      <rect x="794" y="-28" width="6" height="56" rx="3"/><rect x="806" y="-42" width="6" height="84" rx="3"/>
      <rect x="818" y="-18" width="6" height="36" rx="3"/>
    </g>
    <!-- Narrator -->
    <g fill="#5d6175">
      <rect x="842" y="-16" width="6" height="32" rx="3"/><rect x="854" y="-24" width="6" height="48" rx="3"/>
      <rect x="866" y="-12" width="6" height="24" rx="3"/><rect x="878" y="-20" width="6" height="40" rx="3"/>
      <rect x="890" y="-9" width="6" height="18" rx="3"/>
    </g>
    <!-- Nephis (whisper: low) -->
    <g fill="#f2c46d">
      <rect x="914" y="-10" width="6" height="20" rx="3"/><rect x="926" y="-16" width="6" height="32" rx="3"/>
      <rect x="938" y="-12" width="6" height="24" rx="3"/><rect x="950" y="-18" width="6" height="36" rx="3"/>
      <rect x="962" y="-8" width="6" height="16" rx="3"/>
    </g>
    <!-- Kai -->
    <g fill="#7fb8ff">
      <rect x="986" y="-28" width="6" height="56" rx="3"/><rect x="998" y="-44" width="6" height="88" rx="3"/>
      <rect x="1010" y="-32" width="6" height="64" rx="3"/><rect x="1022" y="-50" width="6" height="100" rx="3"/>
      <rect x="1034" y="-24" width="6" height="48" rx="3"/><rect x="1046" y="-36" width="6" height="72" rx="3"/>
    </g>
    <!-- Narrator -->
    <g fill="#5d6175">
      <rect x="1070" y="-14" width="6" height="28" rx="3"/><rect x="1082" y="-22" width="6" height="44" rx="3"/>
      <rect x="1094" y="-10" width="6" height="20" rx="3"/><rect x="1106" y="-18" width="6" height="36" rx="3"/>
      <rect x="1118" y="-12" width="6" height="24" rx="3"/><rect x="1130" y="-20" width="6" height="40" rx="3"/>
      <rect x="1142" y="-8" width="6" height="16" rx="3"/><rect x="1154" y="-14" width="6" height="28" rx="3"/>
      <rect x="1166" y="-6" width="6" height="12" rx="3"/><rect x="1178" y="-10" width="6" height="20" rx="3"/>
    </g>
  </g>
  <rect width="1280" height="400" fill="url(#fade)"/>

  <!-- Legend: who is speaking -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9a97b0" letter-spacing="1">
    <circle cx="372" cy="364" r="5" fill="#5d6175"/><text x="382" y="369">Narrator</text>
    <circle cx="470" cy="364" r="5" fill="#8b7bff"/><text x="480" y="369">Sunny</text>
    <circle cx="548" cy="364" r="5" fill="#f2c46d"/><text x="558" y="369">Nephis</text>
    <circle cx="632" cy="364" r="5" fill="#5fd0c3"/><text x="642" y="369">Cassie</text>
    <circle cx="712" cy="364" r="5" fill="#ff8a65"/><text x="722" y="369">Effie</text>
    <circle cx="782" cy="364" r="5" fill="#7fb8ff"/><text x="792" y="369">Kai</text>
    <circle cx="840" cy="364" r="5" fill="#a3b18a"/><text x="850" y="369">a soldier</text>
  </g>
</svg>
